worker_processes auto;

events {
    worker_connections 2048;
}

http {
    access_log off;

    upstream compliance_backend {
        # Least-connections rather than round-robin: compliance reports vary in
        # cost depending on how many policies apply to the device's group, so
        # sending each request to the least busy replica spreads real load more
        # evenly than spreading request counts.
        least_conn;

        # After 2 failures inside 5 seconds a replica is taken out of rotation
        # and re-probed once the window elapses. This is what makes a killed
        # replica stop receiving traffic within seconds instead of continuing
        # to absorb and fail a third of the fleet's reports.
        server compliance-1:8003 max_fails=2 fail_timeout=5s;
        server compliance-2:8003 max_fails=2 fail_timeout=5s;
        server compliance-3:8003 max_fails=2 fail_timeout=5s;

        keepalive 96;
    }

    server {
        listen 8080;

        location = /lb-health {
            add_header Content-Type application/json always;
            return 200 '{"status":"healthy","service":"compliance-load-balancer"}';
        }

        location / {
            proxy_pass http://compliance_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;

            # If the chosen replica is dead or dies mid-request, retry the same
            # request against another replica rather than returning an error.
            # This is why killing a replica mid-run costs latency on a handful
            # of requests instead of dropping them.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }
}
